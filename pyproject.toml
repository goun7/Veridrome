[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veridrome"
version = "0.1.0"
description = "Autonomous AI Agent Live Evaluation, Hardware-Attested Execution & Anti-Gaming Benchmark Harness"
readme = "VERIDROME.md"
authors = [{ name = "Veridrome Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "cryptography>=41.0.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "playwright>=1.40.0",
    "pyyaml>=6.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    # server- ( api.py/VAPAP-middleware) FastAPI-uzarina-insaa-edildi;
    # testlerin-4-modulu-de-bunu-import-ediyor. Eksiklikte collection hatasi.
    "fastapi>=0.110.0",
    "starlette>=0.36.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    # testler- ( test_cli_main_dallar/test_server_api_dallar) httpx'i-direkt-
    # import-eder. httpx2-ayni-paketi-SAGLAMAZ- ( bagimsiz-paket).
    "httpx>=0.27",
    # starlette>=1.6-testclient-httpx2-ister ( aksi-halde-deprecation-hatasi).
    "httpx2>=0.40",
]

[project.scripts]
veridrome = "veridrome.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]

