name: Veridrome CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test-and-verify:
    name: Pytest, Playwright & Web3 Attestation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install web3 eth-utils httpx2

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Run Full Pytest Suite
        run: |
          PYTHONPATH=src pytest tests/ -q

      - name: Run E2E Live Chromium Benchmark
        run: |
          python scripts/run_e2e_benchmark.py

      - name: Run Web3 Sepolia Testnet Dry-Run
        run: |
          python scripts/deploy_sepolia.py
