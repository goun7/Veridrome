version: '3.8'

services:
  veridrome-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runner
    container_name: veridrome-runner-node
    ports:
      - "8000:8000"
    environment:
      - TEE_PLATFORM=AMD-SEV-SNP
      - TEE_PCR0_MOCK=0x98f12a4b8823901234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - otel-collector
    networks:
      - veridrome-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: veridrome-otel-collector
    command: ["--config=/etc/otel_collector.yaml"]
    volumes:
      - ./otel_collector.yaml:/etc/otel_collector.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks:
      - veridrome-net

networks:
  veridrome-net:
    driver: bridge
